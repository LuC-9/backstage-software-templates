name: ${{ values.app_name }}-cicd

on:
  push:
    branches:
      - main
    paths:
      - src/**

jobs:
  ci:
    runs-on: ubuntu-latest

    outputs:
      commit_id: ${{ steps.commit.outputs.commit_id }}

    steps:
      - uses: actions/checkout@v3

      - name: Generate commit id
        id: commit
        run: echo "commit_id=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: luc09/${{ values.app_name }}:${{ steps.commit.outputs.commit_id }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Update Helm values
        run: |
          FILE="charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml"
          TAG="${{ needs.ci.outputs.commit_id }}"

          echo "Updating $FILE with tag $TAG"

          sudo apt-get update && sudo apt-get install -y yq
          yq -Yi ".image.tag = \"$TAG\"" "$FILE"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.commit_id }}"

      - name: Install ArgoCD CLI
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Login to ArgoCD
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}

      - name: Ensure ArgoCD app
        run: |
          APP_NAME=${{ values.app_name }}

          argocd app get $APP_NAME || argocd app create $APP_NAME \
            --repo https://github.com/aarsh-mishra-exp/$APP_NAME.git \
            --path charts/$APP_NAME \
            --dest-namespace ${{ values.app_env }} \
            --dest-server https://kubernetes.default.svc \
            --values values-${{ values.app_env }}.yaml \
            --revision main \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: Sync app
        run: |
          APP_NAME=${{ values.app_name }}
          argocd app sync $APP_NAME
          argocd app wait $APP_NAME --timeout 180
